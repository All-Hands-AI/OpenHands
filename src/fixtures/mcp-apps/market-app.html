<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="MCP$DEMO_APP_TITLE">OPEN market demo</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #171b24;
        --surface: #21252f;
        --border: #383f50;
        --foreground: #e5e7eb;
        --secondary: #aeb4c2;
        --accent: #c9b974;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/1.5 "Segoe UI",
          "Microsoft YaHei",
          "PingFang SC",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .panel {
        padding: 24px;
      }
      .header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 16px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--secondary);
        font-size: 12px;
      }
      .symbol-mark {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--accent);
        font-weight: 600;
      }
      h2 {
        margin: 8px 0 0;
        font-size: 16px;
        font-weight: 600;
        text-wrap: balance;
      }
      .badge {
        margin-top: 2px;
        padding: 3px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--secondary);
        font-size: 11px;
        white-space: nowrap;
      }
      .metric {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        margin: 20px 0 0;
        font-variant-numeric: tabular-nums;
      }
      .metric strong {
        font-size: 40px;
        line-height: 1.1;
        font-weight: 600;
      }
      .unit {
        color: var(--secondary);
        font-size: 12px;
      }
      .change {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-inline-start: auto;
        color: var(--accent);
        font-size: 13px;
        font-weight: 500;
      }
      .change svg {
        width: 14px;
        height: 14px;
      }
      .chart {
        margin: 24px 0 20px;
      }
      .chart svg {
        display: block;
        width: 100%;
        height: 128px;
        overflow: visible;
        direction: ltr;
      }
      .grid-line {
        stroke: var(--border);
        stroke-width: 1;
        stroke-dasharray: 3 6;
      }
      .chart-line {
        fill: none;
        stroke: var(--accent);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chart-area {
        fill: var(--accent);
        opacity: 0.06;
      }
      .axis {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        color: var(--secondary);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        direction: ltr;
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin: 0;
        padding: 16px 0;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }
      .meta dt {
        color: var(--secondary);
        font-size: 11px;
      }
      .meta dd {
        margin: 5px 0 0;
        font-size: 12px;
        font-weight: 500;
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--foreground);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: var(--surface);
      }
      button:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 3px;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #0b0e14;
        font-weight: 600;
      }
      button.primary:hover {
        background: #dacb8b;
      }
      button svg {
        width: 14px;
        height: 14px;
      }
      #status {
        min-height: 18px;
        margin: 12px 0 0;
        color: var(--secondary);
        font-size: 11px;
        text-wrap: pretty;
      }
      @media (max-width: 480px) {
        .panel {
          padding: 18px;
        }
        .header {
          gap: 8px;
        }
        .metric strong {
          font-size: 36px;
        }
        .chart svg {
          height: 108px;
        }
        .meta {
          gap: 12px;
        }
        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .actions .primary {
          grid-column: 1 / -1;
        }
        button {
          min-height: 40px;
          padding-inline: 8px;
        }
      }
      @media (max-width: 330px) {
        .meta {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .meta div {
          display: flex;
          align-items: baseline;
          justify-content: space-between;
          gap: 12px;
        }
        .meta dd {
          margin: 0;
        }
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="header">
        <div>
          <div class="eyebrow">
            <span class="symbol-mark" aria-hidden="true">O</span> OPEN / USD
          </div>
          <h2 data-i18n="MCP$DEMO_APP_HEADING">Interactive market overview</h2>
        </div>
        <span class="badge" data-i18n="MCP$DEMO_APP_SIMULATED"
          >Simulated data</span
        >
      </div>
      <div class="metric">
        <strong id="price">128.40</strong>
        <span class="unit">USD</span>
        <span class="change">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="m7 17 10-10M7 7h10v10" />
          </svg>
          +3.18%
        </span>
      </div>
      <figure
        class="chart"
        aria-label="Simulated intraday trend, up 3.18%"
        data-i18n-aria-label="MCP$DEMO_APP_CHART_DESCRIPTION"
      >
        <svg
          viewBox="0 0 620 128"
          preserveAspectRatio="none"
          role="img"
          aria-label="Simulated trend"
          data-i18n-aria-label="MCP$DEMO_APP_CHART_LABEL"
        >
          <path class="grid-line" d="M0 20H620 M0 64H620 M0 108H620" />
          <path
            class="chart-area"
            d="M0 106 36 97 56 100 86 77 108 84 142 69 165 74 195 86 224 65 255 70 286 45 309 49 330 31 357 41 390 29 421 35 455 19 484 24 519 10 545 22 576 15 620 3V128H0Z"
          />
          <path
            class="chart-line"
            d="M0 106 36 97 56 100 86 77 108 84 142 69 165 74 195 86 224 65 255 70 286 45 309 49 330 31 357 41 390 29 421 35 455 19 484 24 519 10 545 22 576 15 620 3"
          />
          <circle cx="620" cy="3" r="3.5" fill="var(--accent)" />
        </svg>
        <div class="axis" aria-hidden="true">
          <span>09:30</span><span>11:00</span><span>13:00</span
          ><span>15:00</span>
        </div>
      </figure>
      <dl class="meta">
        <div>
          <dt data-i18n="MCP$DEMO_APP_TOOL_INPUT">Tool input</dt>
          <dd id="symbol" data-i18n="MCP$DEMO_APP_WAITING">Waiting</dd>
        </div>
        <div>
          <dt data-i18n="MCP$DEMO_APP_PRIVATE_RESULT">Private result</dt>
          <dd id="private" data-i18n="MCP$DEMO_APP_WAITING">Waiting</dd>
        </div>
        <div>
          <dt data-i18n="MCP$DEMO_APP_SANDBOX_STATUS">Sandbox status</dt>
          <dd id="isolation" data-i18n="MCP$DEMO_APP_CHECKING">Checking</dd>
        </div>
      </dl>
      <div class="actions">
        <button class="primary" id="refresh" type="button">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path
              d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"
            />
          </svg>
          <span data-i18n="MCP$DEMO_APP_REFRESH">Refresh data</span>
        </button>
        <button id="context" type="button" data-i18n="MCP$DEMO_APP_CONTEXT">
          Add to model context
        </button>
        <button id="message" type="button" data-i18n="MCP$DEMO_APP_MESSAGE">
          Send follow-up message
        </button>
      </div>
      <p id="status" role="status">Initializing…</p>
    </main>
    <script type="application/json" id="mcp-demo-translations">
      __MCP_DEMO_TRANSLATIONS__
    </script>
    <script>
      (() => {
        const translations = JSON.parse(
          document.getElementById("mcp-demo-translations").textContent,
        );
        let locale = "en";
        let statusState = { key: "MCP$DEMO_APP_INITIALIZING", message: "" };
        let nextId = 0;
        let initialized = false;
        const pending = new Map();
        const post = (message) => parent.postMessage(message, "*");
        const notify = (method, params = {}) =>
          post({ jsonrpc: "2.0", method, params });
        const request = (method, params, action) => {
          const id = String(++nextId);
          pending.set(id, action);
          post({ jsonrpc: "2.0", id, method, params });
        };
        const t = (key) => translations[locale]?.[key] ?? translations.en[key];
        const renderStatus = () => {
          document.getElementById("status").textContent = t(
            statusState.key,
          ).replaceAll("{{message}}", () => statusState.message);
        };
        const status = (key, message = "") => {
          statusState = { key, message };
          renderStatus();
        };
        const reportSize = () => {
          if (initialized)
            notify("ui/notifications/size-changed", {
              height: Math.ceil(document.body.getBoundingClientRect().height),
            });
        };
        const applyLocale = (requestedLocale = "en") => {
          const supported = Object.keys(translations);
          const normalized = requestedLocale.toLowerCase();
          locale =
            supported.find((value) => value.toLowerCase() === normalized) ??
            supported.find(
              (value) => value.toLowerCase() === normalized.split("-")[0],
            ) ??
            "en";
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
          document.querySelectorAll("[data-i18n]").forEach((element) => {
            element.textContent = t(element.dataset.i18n);
          });
          document
            .querySelectorAll("[data-i18n-aria-label]")
            .forEach((element) => {
              element.setAttribute(
                "aria-label",
                t(element.dataset.i18nAriaLabel),
              );
            });
          renderStatus();
          reportSize();
        };

        try {
          localStorage.setItem("mcp-app-probe", "1");
          document.cookie = "mcp_app_probe=1";
          document.getElementById("isolation").dataset.i18n =
            "MCP$DEMO_APP_NOT_ISOLATED";
        } catch {
          document.getElementById("isolation").dataset.i18n =
            "MCP$DEMO_APP_ISOLATED";
        }
        applyLocale();

        addEventListener("message", (event) => {
          if (event.source !== parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if ("id" in message && ("result" in message || "error" in message)) {
            const action = pending.get(String(message.id));
            pending.delete(String(message.id));
            if (message.error) {
              status("MCP$DEMO_APP_REQUEST_REJECTED", message.error.message);
            } else if (action === "initialize") {
              applyLocale(message.result.hostContext?.locale);
              initialized = true;
              notify("ui/notifications/initialized");
              status("MCP$DEMO_APP_READY");
              reportSize();
            } else if (action === "refresh") {
              document.getElementById("price").textContent =
                message.result.structuredContent.price;
              status("MCP$DEMO_APP_REFRESHED");
            } else if (action === "context") {
              status("MCP$DEMO_APP_CONTEXT_SENT");
            } else if (action === "message") {
              status("MCP$DEMO_APP_MESSAGE_SENT");
            }
            return;
          }
          if (message.method === "ui/notifications/tool-input") {
            const symbol = document.getElementById("symbol");
            symbol.removeAttribute("data-i18n");
            symbol.textContent = message.params.arguments.symbol;
          }
          if (message.method === "ui/notifications/tool-result") {
            const privateResult = document.getElementById("private");
            privateResult.removeAttribute("data-i18n");
            privateResult.textContent = message.params._meta.privateSelection;
          }
          if (
            message.method === "ui/notifications/host-context-changed" &&
            typeof message.params?.locale === "string"
          ) {
            applyLocale(message.params.locale);
          }
        });

        new ResizeObserver(reportSize).observe(document.body);
        document
          .getElementById("refresh")
          .addEventListener("click", () =>
            request(
              "tools/call",
              { name: "refresh_market", arguments: { symbol: "OPEN" } },
              "refresh",
            ),
          );
        document.getElementById("context").addEventListener("click", () =>
          request(
            "ui/update-model-context",
            {
              content: [
                { type: "text", text: t("MCP$DEMO_APP_CONTEXT_PAYLOAD") },
              ],
            },
            "context",
          ),
        );
        document.getElementById("message").addEventListener("click", () =>
          request(
            "ui/message",
            {
              role: "user",
              content: [
                { type: "text", text: t("MCP$DEMO_APP_MESSAGE_PAYLOAD") },
              ],
            },
            "message",
          ),
        );
        request(
          "ui/initialize",
          {
            protocolVersion: "2026-01-26",
            appInfo: { name: "openhands-mcp-app-demo", version: "1.0.0" },
            appCapabilities: {},
          },
          "initialize",
        );
      })();
    </script>
  </body>
</html>
